<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR фрагмент</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@500;700;800&display=swap');

    :root {
      --ink: #332a2a;
      --soft-ink: rgba(51, 42, 42, 0.72);
      --paper: #fff7df;
      --paper-2: #ffe8de;
      --paper-3: #e8f6ff;
      --pink: #ff9ebb;
      --yellow: #ffe58b;
      --blue: #bfe8ff;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      color: var(--ink);
      font-family: "Nunito", system-ui, sans-serif;
      background:
        radial-gradient(circle at 50% 22%, rgba(255, 158, 187, 0.26), transparent 34%),
        radial-gradient(circle at 22% 82%, rgba(191, 232, 255, 0.55), transparent 34%),
        radial-gradient(circle at 85% 72%, rgba(255, 229, 139, 0.34), transparent 30%),
        linear-gradient(145deg, #fffaf0 0%, #fff1ec 48%, #eaf7ff 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 22px;
      border: 6px dashed rgba(51, 42, 42, 0.12);
      border-radius: 42px;
      pointer-events: none;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      opacity: 0.18;
      pointer-events: none;
      background-image:
        radial-gradient(rgba(51, 42, 42, 0.20) 0.7px, transparent 0.7px);
      background-size: 9px 9px;
      mix-blend-mode: multiply;
    }

    .doodle {
      position: fixed;
      pointer-events: none;
      opacity: 0.18;
      color: var(--ink);
      font-family: "Caveat", cursive;
      font-weight: 700;
      transform: rotate(var(--r));
      user-select: none;
    }

    .d1 { top: 10%; left: 8%; font-size: 110px; --r: -16deg; }
    .d2 { top: 16%; right: 10%; font-size: 78px; --r: 14deg; }
    .d3 { bottom: 14%; left: 14%; font-size: 86px; --r: 9deg; }
    .d4 { bottom: 10%; right: 12%; font-size: 122px; --r: -10deg; }

    main {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
    }

    .card {
      width: min(680px, calc(100vw - 48px));
      min-height: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding: 46px 38px 52px;
      border: 7px solid var(--ink);
      border-radius: 42px;
      background: rgba(255, 250, 239, 0.84);
      box-shadow: 15px 15px 0 rgba(51, 42, 42, 0.12);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 18px;
      border: 3px solid rgba(51, 42, 42, 0.06);
      border-radius: 30px;
      pointer-events: none;
    }

    .key-stage {
      flex: 1;
      width: 100%;
      display: grid;
      place-items: center;
      position: relative;
    }

    .click-hint {
      appearance: none;
      border: 0;
      background: transparent;
      cursor: pointer;
      color: var(--soft-ink);
      font-family: "Caveat", cursive;
      font-size: clamp(24px, 4vw, 36px);
      font-weight: 700;
      letter-spacing: 0.02em;
      transform: rotate(-1.2deg);
      transition: transform 180ms ease, opacity 180ms ease;
      padding: 12px 20px;
      position: absolute;
      bottom: 0;
    }

    .click-hint:hover {
      transform: rotate(-1.2deg) translateY(-3px) scale(1.04);
      opacity: 0.82;
    }

    .click-hint:active {
      transform: rotate(-1.2deg) translateY(0) scale(0.98);
    }

    .letter-wrap {
      width: 260px;
      height: 260px;
      display: grid;
      place-items: center;
      opacity: 0;
      transform: scale(0.92) rotate(-3deg);
      transition: opacity 350ms ease, transform 700ms cubic-bezier(.2, .9, .22, 1.25);
      position: absolute;
      top: 34px;
    }

    .letter-wrap.show {
      opacity: 1;
      transform: scale(1) rotate(-3deg);
    }

    .letter-bg {
      position: absolute;
      width: 220px;
      height: 220px;
      background: rgba(255, 158, 187, 0.22);
      border-radius: 53% 47% 50% 50%;
      filter: blur(2px);
      transform: rotate(7deg);
    }

    svg {
      width: 210px;
      height: 210px;
      overflow: visible;
      position: relative;
      z-index: 1;
    }

    .draw-letter {
      fill: none;
      stroke: var(--ink);
      stroke-width: 18;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(6px 6px 0 rgba(51, 42, 42, 0.12));
      stroke-dasharray: 620;
      stroke-dashoffset: 620;
    }

    .show .draw-letter {
      animation: draw 2.2s cubic-bezier(.65, 0, .25, 1) forwards;
    }

    @keyframes draw {
      to { stroke-dashoffset: 0; }
    }

    .tiny-note {
      position: absolute;
      left: 26px;
      top: 22px;
      font-family: "Caveat", cursive;
      font-size: 25px;
      opacity: 0.54;
      transform: rotate(-4deg);
    }

    .copy-chip {
      opacity: 0;
      pointer-events: none;
      margin-top: 18px;
      font-family: "Caveat", cursive;
      font-weight: 700;
      font-size: 26px;
      color: rgba(51, 42, 42, 0.70);
      transition: opacity 350ms ease 2.1s;
      transform: rotate(1deg);
    }

    .copy-chip.show {
      opacity: 1;
      pointer-events: auto;
    }

    @media (max-width: 560px) {
      body::before {
        inset: 12px;
        border-width: 4px;
        border-radius: 28px;
      }

      .card {
        min-height: 390px;
        border-width: 5px;
        border-radius: 34px;
        padding: 36px 24px 44px;
      }

      .letter-wrap {
        top: 30px;
      }
    }
  </style>
</head>
<body>
  <div class="doodle d1">♡</div>
  <div class="doodle d2">☆</div>
  <div class="doodle d3">?</div>
  <div class="doodle d4">Ю</div>

  <main>
    <section class="card" aria-label="QR фрагмент ключа">
      <div class="tiny-note">qr fragment</div>

      <div class="key-stage">
        <div id="letterWrap" class="letter-wrap" aria-hidden="true">
          <div class="letter-bg"></div>

          <!-- Рисованная буква Ю: плавно прорисовывается через stroke-dashoffset -->
          <svg viewBox="0 0 220 220" role="img" aria-label="Буква Ю">
            <path class="draw-letter"
              d="M58 42
                 C52 82 52 138 58 178
                 M61 110
                 C82 108 96 108 116 109
                 M150 55
                 C112 55 95 83 95 111
                 C95 147 118 174 151 174
                 C184 174 202 148 202 114
                 C202 80 182 55 150 55" />
          </svg>
        </div>

        <button id="revealBtn" class="click-hint" type="button">
          нажми, чтобы появился ключ
        </button>
      </div>

      <div id="copyChip" class="copy-chip">ключ: Ю</div>
    </section>
  </main>

  <script>
    const revealBtn = document.getElementById('revealBtn');
    const letterWrap = document.getElementById('letterWrap');
    const copyChip = document.getElementById('copyChip');

    revealBtn.addEventListener('click', () => {
      revealBtn.style.opacity = '0';
      revealBtn.style.pointerEvents = 'none';
      letterWrap.classList.add('show');
      copyChip.classList.add('show');
    });
  </script>
</body>
</html>
